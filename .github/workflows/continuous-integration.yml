name: CI/CD build

on:
  workflow_dispatch:
  push:
    branches: [ "release/6.1.0-RC1" ]

jobs:
  build:
    name: Build release/6.1.0-RC1
    if: ${{ !contains(github.event.head_commit.message, 'Release 6.1.0-RC1') }}
    runs-on: ubuntu22-2-8
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 'release/6.1.0-RC1'

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        env:
          ARTIFACTORY_USERNAME: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PASSWORD: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
        run: mvn -s settings.xml -DaltDeploymentRepository=local::file:deployment-repository --no-transfer-progress --batch-mode --update-snapshots deploy

      - name: Deploy to Artifactory
        if: ${{ github.repository == 'spring-projects/spring-batch-commercial' && github.ref_name == 'release/6.1.0-RC1' }}
        uses: spring-io/artifactory-deploy-action@9cb1c7df78cd8d1223de1dde974819fa6378af9f # v0.0.6
        with:
          uri: 'https://usw1.packages.broadcom.com'
          username: ${{ secrets.COMMERCIAL_ARTIFACTORY_USERNAME }}
          password: ${{ secrets.COMMERCIAL_ARTIFACTORY_PASSWORD }}
          build-name: 'spring-batch-release-6.1.0-RC1'
          project: 'spring'
          repository: 'spring-enterprise-maven-dev-local'
          folder: 'deployment-repository'
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-passphrase: ${{ secrets.GPG_PASSPHRASE }}
