name: Create Release Notes
description: 'Create the release notes for a given milestone'
inputs:
  milestone:
    description: 'Name of the GitHub milestone for which release notes will be created'
    required: true
  token:
    description: 'Token to use for authentication with GitHub'
    required: true
runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Generate release notes
      uses: spring-io/github-changelog-generator@f7d7a87a3e7c627ecb8c26cf086c38ac5a939721 # v0.0.14
      with:
        milestone: ${{ inputs.milestone }}
        token: ${{ inputs.token }}
        config-file: .github/actions/create-release-notes/application.yml
    - name: Print release notes
      shell: bash
      run: cat changelog.md
